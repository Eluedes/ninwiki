<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guima Company · Construindo e realizando sonhos</title>
  <meta name="description" content="Guima Company: tecnologia e código para transformar ideias em realidade. Nosso site está em construção, volte em breve.">
  <meta name="theme-color" content="#050914">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Guima Company · Construindo e realizando sonhos">
  <meta property="og:description" content="Tecnologia e código para transformar ideias em realidade. Em construção: volte em breve.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="code" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>

  <main class="hero">
    <p class="badge"><span class="dot" aria-hidden="true"></span> Em construção · build em andamento</p>

    <h1 class="brand" aria-label="Guima Company">
      <span class="glitch" data-text="GUIMA">GUIMA</span>
      <span class="company">COMPANY</span>
    </h1>

    <p class="tagline">Construindo e realizando <em>sonhos</em></p>

    <section class="terminal" aria-label="Status do projeto">
      <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>guima@company ~ build</span></div>
      <pre class="term-body" id="term" aria-live="polite"><span class="line"><b class="prompt">$</b> guima init --dreams</span></pre>
    </section>

    <div class="progress" role="progressbar" aria-label="Progresso do build" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
      <span class="bar" id="bar"></span>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="soon">Estamos compilando algo grande. Volte em breve.</p>
  </main>

  <noscript><p class="noscript">Guima Company · Construindo e realizando sonhos · em construção, volte em breve.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
