# Dependabot: atualizacoes de dependencias, COM POUCO RUIDO.
# - mensal (nao semanal) e no maximo 2 PRs abertos por pasta;
# - minor/patch vem agrupado num unico PR por ecossistema;
# - saltos de versao MAIOR (ex.: zod 3 -> 4, eslint 9 -> 10) sao ignorados: costumam quebrar o build e se atualizam a mao quando valer a pena.
# Alertas de SEGURANCA continuam chegando pelo GitHub (Settings > Code security) independente deste arquivo.
version: 2
updates:
  # API (FastAPI) - pip
  - package-ecosystem: "pip"
    directory: "/NinWiki.Api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api-minor-patch:
        update-types: ["minor", "patch"]

  # Bot do Discord - pip
  - package-ecosystem: "pip"
    directory: "/NinWiki.Bot"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      bot-minor-patch:
        update-types: ["minor", "patch"]

  # Site (Next.js) - npm
  - package-ecosystem: "npm"
    directory: "/NinWiki.Web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  # Guima.Site - npm
  - package-ecosystem: "npm"
    directory: "/Guima.Site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      guima-minor-patch:
        update-types: ["minor", "patch"]

  # Workflows do GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
