name: Verificação do frontend

on:
  push:
    paths:
      - 'NinWiki.Web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'NinWiki.Web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NinWiki.Web
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NinWiki.Web/package-lock.json
      - name: Instalar dependências exatamente como registradas
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Gerar build de produção
        run: npm run build