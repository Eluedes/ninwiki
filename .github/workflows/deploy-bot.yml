name: Deploy Bot na SquareCloud (manual)

# Só roda quando você clica em "Run workflow" (aba Actions). Nunca roda sozinho.
# O .env NÃO fica no repositório nem no pacote: as variáveis vivem no painel da SquareCloud (Variáveis de Ambiente) do app do bot.
#
# Secrets necessários:
#   SQUARE_API_KEY   chave da API da SquareCloud
#   SQUARE_APP_ID_BOT   ID do app bot na SquareCloud
#   (BOT_ENV não é mais usado: cadastre as variáveis no painel do app)

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Reiniciar o app depois do envio'
        type: boolean
        default: true

concurrency:
  group: deploy-squarecloud-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar NinWiki.Bot
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          APP_ID: ${{ secrets.SQUARE_APP_ID_BOT }}
          RESTART: ${{ inputs.restart }}
          GIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-squarecloud.sh NinWiki.Bot ninwiki-bot.zip
