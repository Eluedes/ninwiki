name: Deploy API

# Só roda quando você clica em "Run workflow" (aba Actions). Nunca roda sozinho.
# O .env NÃO fica no repositório nem no pacote: as variáveis vivem no painel da SquareCloud (Variáveis de Ambiente) do app da API.
#
# Secrets necessários:
#   SQUARE_API_KEY   chave da API da SquareCloud
#   SQUARE_APP_ID_API   ID do app API na SquareCloud
#   (DB_SSL_* nao sao mais usados: o texto dos certificados vai em DATABASE_SSL_CA/CERT/KEY nas Variáveis de Ambiente do app)
#   (API_ENV/BOT_ENV não são mais usados: cadastre as variáveis no painel do app)

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Reiniciar o app depois do envio'
        type: boolean
        default: true

concurrency:
  group: deploy-squarecloud-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar NinWiki.Api
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          APP_ID: ${{ secrets.SQUARE_APP_ID_API }}
          # Certificados do banco da SquareCloud (conteudo de cada arquivo); opcionais se o banco nao usar TLS com certificado
          RESTART: ${{ inputs.restart }}
          GIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-squarecloud.sh NinWiki.Api ninwiki-api.zip
